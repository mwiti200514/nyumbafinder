<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyumbaFinder - Find Houses in Ruiru</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#0f766e;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:26px} header p{margin:5px 0 0;opacity:.9}
.container{max-width:900px;margin:auto;padding:15px}
#status{background:#fff;border-left:5px solid #0f766e;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px}
#status.error{border-color:#dc2626} #status.ok{border-color:#16a34a}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card h3{margin:0 0 5px} .price{color:#0f766e;font-weight:bold;font-size:18px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{background:#0f766e;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-size:16px;cursor:pointer;width:100%}
button:active{opacity:.85} .row{display:flex;gap:10px} .row>*{flex:1}
img{width:100%;border-radius:10px;max-height:220px;object-fit:cover}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<header><h1>🏠 NyumbaFinder</h1><p>Find Houses in Ruiru, Juja, Thika Road</p></header>
<div class="container">
<div id="status">⏳ Loading houses...</div>

<div class="card">
<h3>🔍 Search</h3>
<input id="search" placeholder="Search Ruiru, Juja, bedsitter, 1 bedroom..." oninput="render()">
<div class="row">
<select id="filterArea" onchange="render()"><option value="">All Areas</option><option>Ruiru</option><option>Juja</option><option>Thika Road</option><option>Kahawa</option></select>
<select id="filterPrice" onchange="render()"><option value="">Any Price</option><option value="10000">Under 10k</option><option value="20000">Under 20k</option><option value="30000">Under 30k</option></select>
</div>
</div>

<div id="list"></div>

<div class="card">
<h3>➕ Post a House (Free)</h3>
<input id="title" placeholder="Title e.g. Spacious Bedsitter in Ruiru">
<input id="area" placeholder="Area e.g. Ruiru">
<input id="price" type="number" placeholder="Price e.g. 8000">
<input id="phone" placeholder="Phone / WhatsApp e.g. 0712345678">
<textarea id="desc" placeholder="Description, water, wifi, security..."></textarea>
<input id="image" placeholder="Photo link (optional) - paste image URL">
<button onclick="postHouse()">Post House</button>
<p class="small">If internet to Supabase is blocked, your house is saved on this device and will try to sync later. It will NOT disappear.</p>
</div>
</div>

<script>
// ===== CONFIG - PASTE YOUR KEY HERE =====
const SUPABASE_URL = "https://ajrebeffraevdgvtpczy.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_KEY_HERE"; // from Supabase > Settings > API > Publishable key
// ==========================================

let houses = JSON.parse(localStorage.getItem('nyumba_local') || '[]');
let serverHouses = [];

function setStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type || '';
}

function render(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const area = document.getElementById('filterArea').value;
  const maxPrice = document.getElementById('filterPrice').value;
  const all = [...serverHouses, ...houses];
  const filtered = all.filter(h=>{
    if(q && !((h.title||'')+' '+(h.area||'')+' '+(h.description||'')).toLowerCase().includes(q)) return false;
    if(area && h.area !== area) return false;
    if(maxPrice && Number(h.price) > Number(maxPrice)) return false;
    return true;
  });
  const list = document.getElementById('list');
  if(!filtered.length){ list.innerHTML = '<div class="card">No houses found. Be the first to post one below!</div>'; return; }
  list.innerHTML = filtered.map(h=>`
    <div class="card">
      ${h.image_url ? <img src="${h.image_url}"> : ''}
      <h3>${h.title||'House'}</h3>
      <div class="price">Ksh ${Number(h.price||0).toLocaleString()} / month</div>
      <p>📍 ${h.area||''} • 📞 ${h.phone||''}</p>
      <p>${h.description||''}</p>
      <a href="https://wa.me/254${String(h.phone||'').replace(/^0/,'').replace(/\D/g,'')}" target="_blank"><button style="background:#25D366">WhatsApp Landlord</button></a>
    </div>`).join('');
}

async function loadHouses(){
  // 1. Show local first - instant, never fails
  render();
  if(!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE')){
    setStatus('⚠️ Add your Publishable Key in the code (PASTE_YOUR_KEY_HERE) - showing saved houses for now.', 'error');
    return;
  }
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/listings?select=*&order=created_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }
    });
    if(!res.ok) throw new Error('Supabase said: ' + res.status + ' - Check table name is listings and RLS is ON for all');
    serverHouses = await res.json();
    setStatus('✅ Connected to Supabase - ' + serverHouses.length + ' houses from server + ' + houses.length + ' saved on this device', 'ok');
    render();
  }catch(e){
    // 2. DO NOT show Failed to fetch - show useful message + keep local houses
    setStatus('⚠️ Supabase unreachable right now (' + e.message + '). Showing ' + houses.length + ' saved houses. Your posts still work - they save locally.', 'error');
    render();
  }
}

async function postHouse(){
  const h = {
    title: document.getElementById('title').value.trim
