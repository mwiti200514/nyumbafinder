<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyumbaFinder - Find Houses in Migori</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f4f7;color:#222}
header{background:#0b6fa4;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.9}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.08);flex-wrap:wrap}
.tabs button{border:none;padding:10px 18px;border-radius:20px;cursor:pointer;background:#e8eef2;font-weight:bold;font-size:15px}
.tabs button.active{background:#0b6fa4;color:#fff}
.counts{display:flex;gap:10px;justify-content:center;padding:10px;flex-wrap:wrap}
.counts div{background:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:bold}
.counts span{color:#0b6fa4}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
h2{margin:0 0 6px}
.muted{color:#666;font-size:14px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.btn{border:none;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;width:100%}
.btn-blue{background:#0ea5e9;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-orange{background:#f97316;color:#fff}
.btn-gray{background:#e5e7eb}
.house{border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px}
.house h3{margin:0 0 4px}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-wait{background:#fef9c3;color:#854d0e}
.flex{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.flex button{flex:1}
.hidden{display:none!important}
.topbtns{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbtns button{flex:1}
</style>
</head>
<body>

<header>
<h1>🏠 NyumbaFinder</h1>
<p>Find Houses in Migori • Kihancha • Isebania • Migori Town</p>
</header>

<div class="tabs">
<button id="tab-houses" onclick="showTab('houses')" class="active">Houses</button>
<button id="tab-requests" onclick="showTab('requests')">Requests</button>
<button id="tab-admin" onclick="showTab('admin')">Admin</button>
</div>

<div class="counts">
<div>Approved Houses: <span id="cApproved">0</span></div>
<div>Waiting Approval: <span id="cWaiting">0</span></div>
<div>Tenant Requests: <span id="cRequests">0</span></div>
</div>

<div class="wrap">

<!-- HOUSES TAB -->
<div id="sec-houses">
  <div class="topbtns">
    <button class="btn btn-blue" onclick="showForm('tenant')">🔍 I Want a House (Tenant)</button>
    <button class="btn btn-gray" onclick="showForm('landlord')">🏠 Post a House (Landlord)</button>
  </div>

  <!-- TENANT FORM -->
  <div id="form-tenant" class="card">
    <h2>Find Your New House</h2>
    <p class="muted">Fill this form - we will show you only houses that match you.</p>
    <div class="row">
      <div><label>Where do you want to find a house? *</label><input id="t_area" placeholder="e.g. Migori Town, Kihancha"></div>
      <div><label>Where are you currently located? *</label><input id="t_current" placeholder="e.g. Nairobi"></div>
      <div><label>Phone Number *</label><input id="t_phone" placeholder="07..."></div>
      <div><label>Day you want to enter *</label><input id="t_date" type="date"></div>
      <div><label>House Type</label><select id="t_type"><option value="">Any Type</option><option>Single Room</option><option>Bedsitter</option><option>1 Bedroom</option><option>2 Bedroom</option><option>3 Bedroom</option></select></div>
      <div><label>Your Budget</label><select id="t_budget"><option value="100000">Any Budget</option><option value="5000">Up to Ksh 5,000</option><option value="8000">Up to Ksh 8,000</option><option value="12000">Up to Ksh 12,000</option><option value="20000">Up to Ksh 20,000</option></select></div>
    </div>
    <div class="flex" style="margin-top:14px">
      <button class="btn btn-blue" onclick="searchHouses()">🔍 Search Houses For Me</button>
      <button class="btn btn-green" onclick="sendRequest()">📩 Send My Request to Landlords</button>
    </div>
  </div>

  <!-- LANDLORD FORM -->
  <div id="form-landlord" class="card hidden">
    <h2>Post Your House</h2>
    <p class="muted">Your house goes to Waiting Approval. Admin approves it.</p>
    <div class="row">
      <div><label>Your Name (Landlord) *</label><input id="l_name" placeholder="e.g. Mama Otis"></div>
      <div><label>Phone Number *</label><input id="l_phone" placeholder="07..."></div>
      <div><label>Location *</label><input id="l_location" placeholder="e.g. Kihancha, Behind Market"></div>
      <div><label>Area *</label><input id="l_area" placeholder="e.g. Kihancha"></div>
      <div><label>House Type *</label><select id="l_type"><option>Bedsitter</option><option>1 Bedroom</option><option>2 Bedroom</option><option>3 Bedroom</option><option>Single Room</option></select></div>
      <div><label>Rent per Month (Ksh) *</label><input id="l_rent" type="number" placeholder="e.g. 500
